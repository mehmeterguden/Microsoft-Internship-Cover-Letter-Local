<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1320" viewBox="0 0 2400 1320" role="img" aria-labelledby="title desc">
  <title id="title">How Cover Letter Local works</title>
  <desc id="desc">A five-stage local-first workflow from reviewed career evidence through hybrid retrieval, generation, verification, and export, with separate public research and optional cloud paths.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071725"/>
      <stop offset=".48" stop-color="#050b13"/>
      <stop offset="1" stop-color="#071525"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31d6e7"/>
      <stop offset="1" stop-color="#4388ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2030"/>
      <stop offset="1" stop-color="#091522"/>
    </linearGradient>
    <linearGradient id="activePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2a38"/>
      <stop offset="1" stop-color="#0b1b2b"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientTransform="translate(260 250) rotate(35) scale(860 680)">
      <stop offset="0" stop-color="#21d4e7" stop-opacity=".15"/>
      <stop offset="1" stop-color="#21d4e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="0" cy="0" r="1" gradientTransform="translate(2140 1010) rotate(-145) scale(760 620)">
      <stop offset="0" stop-color="#347fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#347fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#31506a" stroke-opacity=".15" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000814" flood-opacity=".46"/>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1L10 6 1 11" fill="none" stroke="#48cfe5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowOptional" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1 1L10 6 1 11" fill="none" stroke="#5793ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="2400" height="1320" fill="url(#background)"/>
  <rect width="2400" height="1320" fill="url(#grid)"/>
  <rect width="2400" height="1320" fill="url(#leftGlow)"/>
  <rect width="2400" height="1320" fill="url(#rightGlow)"/>
  <path d="M0 0H2400" stroke="url(#accent)" stroke-width="8"/>

  <g transform="translate(120 92)">
    <g>
      <rect width="450" height="64" rx="16" fill="#0b2735" stroke="#35cfe2" stroke-width="2"/>
      <rect x="20" y="20" width="24" height="24" rx="6" fill="url(#accent)"/>
      <text x="66" y="42" fill="#c7f3f8" font-family="'SFMono-Regular', Consolas, monospace" font-size="24" font-weight="700" letter-spacing="4">
        LOCAL-FIRST AI WORKFLOW
      </text>
    </g>

    <g transform="translate(1654 0)">
      <rect width="506" height="64" rx="16" fill="#0b1f2a" stroke="#24768a" stroke-width="2"/>
      <circle cx="34" cy="32" r="9" fill="#42d9a6" filter="url(#dotGlow)"/>
      <text x="60" y="42" fill="#a7e8f1" font-family="'SFMono-Regular', Consolas, monospace" font-size="22" font-weight="700" letter-spacing="3">
        PRIVATE BY DEFAULT
      </text>
    </g>

    <text x="0" y="148" fill="#f3f8fc" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="72" font-weight="750" letter-spacing="-2">
      How evidence becomes a <tspan fill="url(#accent)">cover letter</tspan>
    </text>
    <text x="0" y="204" fill="#9fb5c6" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="29">
      A reviewable path from private career context to a grounded, export-ready draft.
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="120" y="338" width="2160" height="520" rx="38" fill="#07131f" stroke="#1d7890" stroke-width="3"/>
    <rect x="144" y="362" width="2112" height="472" rx="28" fill="url(#panel)" stroke="#193b52" stroke-width="2"/>
  </g>

  <g transform="translate(178 396)">
    <rect width="318" height="50" rx="14" fill="#0a2734" stroke="#22778c" stroke-width="2"/>
    <circle cx="28" cy="25" r="7" fill="#42d9a6"/>
    <text x="50" y="34" fill="#8ee4ef" font-family="'SFMono-Regular', Consolas, monospace" font-size="21" font-weight="700" letter-spacing="3">
      ON YOUR DEVICE
    </text>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', sans-serif">
    <g transform="translate(170 484)">
      <rect width="360" height="306" rx="26" fill="#101f2e" stroke="#29495f" stroke-width="2"/>
      <rect x="26" y="24" width="62" height="50" rx="13" fill="#0b3040" stroke="#287b91"/>
      <text x="43" y="58" fill="#66deed" font-size="25" font-weight="750">01</text>
      <text x="108" y="58" fill="#6bd9e9" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">
        IMPORT &amp; REVIEW
      </text>
      <text x="26" y="118" fill="#f1f7fb" font-size="32" font-weight="700">
        Bring your evidence
      </text>
      <text x="26" y="164" fill="#9eb2c2" font-size="24">CV · LinkedIn · GitHub</text>
      <text x="26" y="202" fill="#9eb2c2" font-size="24">Past cover letters</text>
      <path d="M26 232H334" stroke="#254055" stroke-width="2"/>
      <circle cx="38" cy="267" r="7" fill="#42d9a6"/>
      <text x="58" y="276" fill="#b9ceda" font-size="23" font-weight="600">Approve every change</text>
    </g>

    <path d="M546 637H580" fill="none" stroke="#48cfe5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(600 484)">
      <rect width="360" height="306" rx="26" fill="#101f2e" stroke="#29495f" stroke-width="2"/>
      <rect x="26" y="24" width="62" height="50" rx="13" fill="#0b3040" stroke="#287b91"/>
      <text x="43" y="58" fill="#66deed" font-size="25" font-weight="750">02</text>
      <text x="108" y="58" fill="#6bd9e9" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">
        LOCAL KNOWLEDGE
      </text>
      <text x="26" y="118" fill="#f1f7fb" font-size="32" font-weight="700">
        Build your context
      </text>
      <text x="26" y="164" fill="#9eb2c2" font-size="24">Structured profile</text>
      <text x="26" y="202" fill="#9eb2c2" font-size="24">Field provenance</text>
      <path d="M26 232H334" stroke="#254055" stroke-width="2"/>
      <text x="26" y="276" fill="#78d7e5" font-size="22" font-weight="600">Voice guide + ChromaDB</text>
    </g>

    <path d="M976 637H1010" fill="none" stroke="#48cfe5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(1030 484)">
      <rect width="360" height="306" rx="26" fill="url(#activePanel)" stroke="#2ba7bd" stroke-width="3"/>
      <rect x="26" y="24" width="62" height="50" rx="13" fill="#0b3542" stroke="#2eb2c5"/>
      <text x="43" y="58" fill="#78e6f1" font-size="25" font-weight="750">03</text>
      <text x="108" y="58" fill="#82e4ee" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">
        HYBRID RAG
      </text>
      <text x="26" y="118" fill="#f1f7fb" font-size="32" font-weight="700">
        Retrieve what matters
      </text>
      <text x="26" y="164" fill="#a9c0ce" font-size="24">BM25 exact matches</text>
      <text x="26" y="202" fill="#a9c0ce" font-size="24">Dense semantic search</text>
      <path d="M26 232H334" stroke="#2b5263" stroke-width="2"/>
      <text x="26" y="276" fill="#76deeb" font-size="22" font-weight="650">RRF + optional rerank</text>
    </g>

    <path d="M1406 637H1440" fill="none" stroke="#48cfe5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(1460 484)">
      <rect width="360" height="306" rx="26" fill="url(#activePanel)" stroke="#2ba7bd" stroke-width="3"/>
      <rect x="26" y="24" width="62" height="50" rx="13" fill="#0b3542" stroke="#2eb2c5"/>
      <text x="43" y="58" fill="#78e6f1" font-size="25" font-weight="750">04</text>
      <circle cx="326" cy="49" r="8" fill="#42d9a6" filter="url(#dotGlow)"/>
      <text x="108" y="58" fill="#82e4ee" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">
        MODEL GATEWAY
      </text>
      <text x="26" y="118" fill="#f1f7fb" font-size="32" font-weight="700">
        Generate the draft
      </text>
      <text x="26" y="164" fill="#a9c0ce" font-size="24">Foundry Local first</text>
      <text x="26" y="202" fill="#a9c0ce" font-size="24">Other providers optional</text>
      <path d="M26 232H334" stroke="#2b5263" stroke-width="2"/>
      <text x="26" y="276" fill="#76deeb" font-size="22" font-weight="650">Live token streaming</text>
    </g>

    <path d="M1836 637H1870" fill="none" stroke="#48cfe5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(1890 484)">
      <rect width="360" height="306" rx="26" fill="#101f2e" stroke="#29495f" stroke-width="2"/>
      <rect x="26" y="24" width="62" height="50" rx="13" fill="#0b3040" stroke="#287b91"/>
      <text x="43" y="58" fill="#66deed" font-size="25" font-weight="750">05</text>
      <text x="108" y="58" fill="#6bd9e9" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">
        VERIFY &amp; EXPORT
      </text>
      <text x="26" y="118" fill="#f1f7fb" font-size="32" font-weight="700">
        Stay in control
      </text>
      <text x="26" y="164" fill="#9eb2c2" font-size="24">Claim-level audit</text>
      <text x="26" y="202" fill="#9eb2c2" font-size="24">Local PII scan</text>
      <path d="M26 232H334" stroke="#254055" stroke-width="2"/>
      <text x="26" y="276" fill="#78d7e5" font-size="22" font-weight="600">PDF · Word · saved letter</text>
    </g>
  </g>

  <g transform="translate(120 902)" filter="url(#shadow)">
    <rect width="1030" height="286" rx="32" fill="#081724" stroke="#246d82" stroke-width="2"/>
    <rect x="24" y="24" width="982" height="238" rx="24" fill="#0b1b29" stroke="#1c3a4e" stroke-width="2"/>
    <rect x="54" y="48" width="430" height="46" rx="13" fill="#0a2633" stroke="#24768a"/>
    <text x="78" y="79" fill="#77dce9" font-family="'SFMono-Regular', Consolas, monospace" font-size="20" font-weight="700" letter-spacing="3">
      PUBLIC COMPANY RESEARCH
    </text>
    <text x="54" y="142" fill="#f1f7fb" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="31" font-weight="700">
      Public sources become cited context
    </text>
    <g transform="translate(54 172)" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="22" font-weight="600">
      <rect width="190" height="52" rx="14" fill="#102333" stroke="#2a4a62"/>
      <text x="28" y="34" fill="#abc0ce">6 parallel agents</text>
      <path d="M210 26H244" stroke="#48cfe5" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="264" width="190" height="52" rx="14" fill="#102333" stroke="#2a4a62"/>
      <text x="290" y="34" fill="#abc0ce">7 public tools</text>
      <path d="M474 26H508" stroke="#48cfe5" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="528" width="188" height="52" rx="14" fill="#102333" stroke="#2a4a62"/>
      <text x="549" y="34" fill="#abc0ce">Outbound guard</text>
      <path d="M736 26H770" stroke="#48cfe5" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="790" width="162" height="52" rx="14" fill="#0d2a38" stroke="#2ba7bd"/>
      <text x="812" y="34" fill="#7de0ec">Cited report</text>
    </g>
  </g>

  <path d="M1080 900C1150 838 1410 858 1574 810" fill="none" stroke="#48cfe5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="1120" y="834" width="330" height="46" rx="13" fill="#071722" stroke="#225a6e"/>
  <text x="1145" y="864" fill="#7edeea" font-family="'SFMono-Regular', Consolas, monospace" font-size="19" font-weight="700" letter-spacing="2">
    CACHED COMPANY REPORT
  </text>

  <g transform="translate(1230 902)" filter="url(#shadow)">
    <rect width="1050" height="286" rx="32" fill="#081421" stroke="#315b91" stroke-width="2" stroke-dasharray="12 10"/>
    <rect x="24" y="24" width="1002" height="238" rx="24" fill="#0a1727" stroke="#233b5b" stroke-width="2"/>
    <rect x="54" y="48" width="450" height="46" rx="13" fill="#0b2034" stroke="#315f96"/>
    <text x="78" y="79" fill="#8ab7ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="20" font-weight="700" letter-spacing="3">
      OPTIONAL CLOUD INFERENCE
    </text>
    <text x="54" y="142" fill="#f1f7fb" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="31" font-weight="700">
      The network path is a deliberate choice
    </text>
    <circle cx="66" cy="194" r="7" fill="#5793ff"/>
    <text x="88" y="202" fill="#a8bdd0" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="23">
      Used only when you explicitly select a cloud provider
    </text>
    <circle cx="66" cy="234" r="7" fill="#5793ff"/>
    <text x="88" y="242" fill="#a8bdd0" font-family="'Segoe UI', 'Helvetica Neue', sans-serif" font-size="23">
      Required prompt context goes to the selected vendor
    </text>
  </g>

  <path d="M1640 808C1670 854 1770 874 1770 902" fill="none" stroke="#5793ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 12" marker-end="url(#arrowOptional)"/>
  <rect x="1692" y="824" width="286" height="44" rx="13" fill="#081522" stroke="#315b91"/>
  <text x="1717" y="853" fill="#8ab7ff" font-family="'SFMono-Regular', Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2">
    EXPLICIT OPT-IN
  </text>

  <g transform="translate(120 1242)" font-family="'SFMono-Regular', Consolas, monospace" font-size="19" font-weight="650" letter-spacing="2">
    <circle cx="10" cy="0" r="7" fill="#42d9a6"/>
    <text x="30" y="7" fill="#91a9ba">LOCAL DATA AND PROCESSING</text>
    <path d="M390 0H460" stroke="#48cfe5" stroke-width="4"/>
    <text x="480" y="7" fill="#91a9ba">LOCAL WORKFLOW</text>
    <path d="M760 0H830" stroke="#5793ff" stroke-width="4" stroke-dasharray="10 9"/>
    <text x="850" y="7" fill="#91a9ba">NETWORK BOUNDARY</text>
  </g>
</svg>
