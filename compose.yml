name: cover-letter-local

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/cover_letter_local.db
      CHROMA_PATH: /app/data/chroma
      FRONTEND_ORIGIN: http://localhost:${APP_PORT:-8080}
    volumes:
      - ./runtime-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
